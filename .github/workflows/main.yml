name: Daily GW Paper Check

on:
  workflow_dispatch:
  schedule:
    - cron: '13 20 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリのインストール
        run: |
          pip install arxiv google-genai requests

      - name: スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: python -u arxiv_paper_check.py
